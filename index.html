<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web de Isaías</title>
    <style>

        body {
            background-color: #2b5c66;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }



        .main-container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);

            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }


        .welcome-text {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }


        .welcome-text a {
            color: #e066ff; /* Morado llamativo */
            text-decoration: none;
            font-weight: bold;
            border-bottom: 2px dashed #e066ff;
            transition: color 0.3s;
        }
        .welcome-text a:hover {
            color: #00ffcc;
            border-bottom-color: #00ffcc;
        }


        .menu-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 30px 0;
        }


        .menu-links a {
            display: block;
            padding: 12px 20px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }


        .Cv a { border-left: 5px solid #00ffcc; }
        .by a { border-left: 5px solid #ff9900; }
        .tp a { border-left: 5px solid #ffd700; }


        .menu-links p a:hover {
            background: #ffffff;
            color: #2b5c66;
            transform: translateY(-2px);
        }


        .music-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .music-title {
            font-size: 1rem;
            color: #e066ff;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .spotify-widget {
            border-radius: 12px;
            width: 100%;
            max-width: 350px;
            height: 350px;
        }
    </style>
</head>
<body>

<div class="main-container">

    <p class="welcome-text">
        Hola soy isaías, estoy trabajando en mi página web, mientras tanto.
        Disfruta de este episodio de los
        <a href="https://www.youtube.com/watch?v=Fg_KxhW8-PY" target="_blank">Looney Tunes</a>.
    </p>

    </div>
